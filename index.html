<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>3桁数字カウンター</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: dark; --bg:#111827; --panel:#1f2937; --button:#374151; --accent:#2563eb; --text:#f9fafb; --muted:#9ca3af; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100svh; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      display:flex; justify-content:center; align-items:center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }
    .app { width:min(100%,480px); display:flex; flex-direction:column; gap:22px; text-align:center; }
    h1 { margin:0; font-size:1.25rem; font-weight:700; }
    .display-wrap { background:var(--panel); border-radius:24px; padding:clamp(24px,8vw,42px) 12px; }
    #number {
      font-size:clamp(2.6rem,17vw,5.2rem); font-weight:800; letter-spacing:.025em;
      line-height:1.15; white-space:nowrap; font-variant-numeric:tabular-nums;
    }
    .hint { color:var(--muted); font-size:.85rem; margin-top:12px; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button {
      border:0; border-radius:16px; min-height:64px; padding:12px;
      background:var(--button); color:var(--text); font-size:1.1rem; font-weight:700;
      touch-action:manipulation;
    }
    button:active { transform:scale(.98); filter:brightness(1.15); }
    #next { background:var(--accent); }
    #reset { grid-column:1 / -1; min-height:54px; font-size:1rem; }
    .settings { background:var(--panel); border-radius:18px; padding:16px; text-align:left; }
    .settings-title { font-weight:700; margin-bottom:10px; }
    .setting-row { display:flex; gap:10px; align-items:center; }
    input {
      width:76px; min-height:48px; border:1px solid #4b5563; border-radius:12px;
      background:#111827; color:var(--text); text-align:center; font-size:1.2rem;
    }
    #set-start { min-height:48px; flex:1; font-size:.95rem; }
    .small { color:var(--muted); font-size:.78rem; margin-top:9px; }
    #message { min-height:1.2em; color:#93c5fd; font-size:.85rem; }
    @media (orientation:landscape) and (max-height:520px) {
      body { align-items:flex-start; padding-top:12px; }
      .app { gap:10px; max-width:620px; }
      .display-wrap { padding:12px; }
      #number { font-size:clamp(2rem,10vh,3.6rem); }
      button { min-height:48px; }
      .settings { padding:10px 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>3桁数字カウンター</h1>
    <section class="display-wrap" aria-live="polite">
      <div id="number">1・2・3</div>
      <div class="hint">3つの数字を順番にカウント</div>
    </section>

    <section class="controls">
      <button id="prev" type="button">1つ前</button>
      <button id="next" type="button">次</button>
      <button id="reset" type="button">リセット（1.5秒長押し）</button>
    </section>

    <section class="settings">
      <div class="settings-title">開始数字の設定</div>
      <div class="setting-row">
        <label for="start-digit">最初の数字</label>
        <input id="start-digit" type="number" inputmode="numeric" min="0" max="9" value="1">
        <button id="set-start" type="button">設定する</button>
      </div>
      <div class="small">0〜9を指定できます。例：5なら「5・6・7」から開始します。</div>
    </section>
    <div id="message" role="status"></div>
  </main>

  <script>
    const numberEl = document.getElementById('number');
    const startInput = document.getElementById('start-digit');
    const messageEl = document.getElementById('message');
    const STORAGE_KEY = 'number_counter_3_state_v1';

    let state = { start: 1, step: 0 };
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && Number.isInteger(saved.start) && Number.isInteger(saved.step)
          && saved.start >= 0 && saved.start <= 9) state = saved;
    } catch (_) {}

    function render() {
      const first = ((state.start + state.step) % 10 + 10) % 10;
      const digits = [first, (first + 1) % 10, (first + 2) % 10];
      numberEl.textContent = digits.join('・');
      startInput.value = String(state.start);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    document.getElementById('next').addEventListener('click', () => {
      state.step += 1; render(); messageEl.textContent = '';
    });
    document.getElementById('prev').addEventListener('click', () => {
      state.step -= 1; render(); messageEl.textContent = '';
    });

    document.getElementById('set-start').addEventListener('click', () => {
      const value = Number(startInput.value);
      if (!Number.isInteger(value) || value < 0 || value > 9) {
        messageEl.textContent = '0〜9の数字を入力してください。';
        return;
      }
      state.start = value;
      state.step = 0;
      render();
      messageEl.textContent = '開始数字を設定しました。';
    });

    const resetButton = document.getElementById('reset');
    let pressTimer = null;
    let resetReady = false;
    function beginResetPress(event) {
      if (event.type === 'mousedown' && event.button !== 0) return;
      resetReady = false;
      resetButton.textContent = 'そのまま長押し…';
      pressTimer = setTimeout(() => {
        resetReady = true;
        state.step = 0;
        render();
        messageEl.textContent = 'カウンターをリセットしました。';
        resetButton.textContent = 'リセット（1.5秒長押し）';
      }, 1500);
    }
    function cancelResetPress() {
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
      if (!resetReady) resetButton.textContent = 'リセット（1.5秒長押し）';
    }
    resetButton.addEventListener('pointerdown', beginResetPress);
    resetButton.addEventListener('pointerup', cancelResetPress);
    resetButton.addEventListener('pointerleave', cancelResetPress);
    resetButton.addEventListener('pointercancel', cancelResetPress);
    resetButton.addEventListener('contextmenu', e => e.preventDefault());

    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
